<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}TDO Tools{% endblock %} — The Deal Outlet</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet"/>
</head>
<body>

  <header>
    <a class="logo-link" href="{{ url_for('home') }}">
      <img src="https://www.thedealoutlet.com/on/demandware.static/Sites-TheDealOutlet_AE-Site/-/default/dw95478736/images/logo.svg" alt="The Deal Outlet" />
      <div class="divider"></div>
      <span>{% block header_label %}TDO Tools{% endblock %}</span>
    </a>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>© The Deal Outlet — Internal Tools</footer>

  {% block scripts %}{% endblock %}
</body>
</html>
